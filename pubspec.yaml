name: sports_rostering
description: Multi-sport team roster, scheduling, and drop-in session management
publish_to: "none"
version: 1.3.2+53

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  image_picker: ^1.1.2
  image_cropper: ^9.0.0
  flutter_local_notifications: ^18.0.0

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^17.1.0

  # Firebase — versions resolved by pub (compatible set)
  # firebase_messaging and firebase_crashlytics deferred to Phase 2 (core version conflict at earlier versions)
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  google_sign_in: ^6.2.0
  firebase_messaging: ^16.1.1
  firebase_crashlytics: ^5.0.7
  cloud_functions: ^6.1.0
  flutter_native_splash: ^2.3.8
  firebase_storage: ^13.2.0
  firebase_app_check: ^0.4.2
  firebase_analytics: ^12.2.0

  # Local Storage
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.2.2

  # Ads (Google AdMob)
  google_mobile_ads: ^5.0.0

  # In-app purchases (Remove Ads)
  in_app_purchase: ^3.2.0

  # Sign in with Apple (required by App Store when any social login is offered)
  sign_in_with_apple: ^6.0.0

  # Biometric authentication (Face ID / Touch ID / Fingerprint)
  local_auth: ^2.3.0

  # Utilities
  url_launcher: ^6.3.0
  package_info_plus: ^10.1.0
  connectivity_plus: ^7.0.0
  share_plus: ^13.0.0
  pdf: ^3.11.0
  printing: ^5.13.0
  intl: ^0.20.0

  # In-app review prompt (rate the app)
  in_app_review: ^2.0.9

  # Form validation
  form_builder_validators: ^11.0.0

  # QR code generation and scanning
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0

  # Google Places autocomplete
  google_places_flutter: ^2.0.8

  # Typography
  google_fonts: ^6.2.1

  # HTTP client — used on Windows to call Cloud Functions HTTPS callable
  # endpoints directly (cloud_functions has no Windows platform plugin)
  http: ^1.2.0

  # Notifications badge — deferred to Phase 3
  # app_badge_plus: ^1.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  flutter_launcher_icons: ^0.14.4

  # Packages the Windows build as an .msix for Microsoft Store submission
  msix: ^3.16.7

flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: false

  assets:
    - assets/icons/
    - assets/sport_icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 23
  remove_alpha_ios: true
  # Adaptive icon for Android 8+ — blue background matches icon background
  adaptive_icon_background: "#2196F3"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  web:
    generate: false
  windows:
    generate: true

# MSIX packaging for Microsoft Store submission.
# Build with: flutter build windows --release --dart-define-from-file=env.json
# Then:       dart run msix:create
#
# identity_name / publisher reserved in Partner Center (Store ID: 9NMWGL6X028C,
# Package Family Name: KernkraftConsultingInc.SportsRostering_660a73mhqnjyy).
# msix_version must be bumped (X.Y.Z.0, matches version.txt) on every
# Store-bound package; a version already used in a submission is rejected.
# store: true is required for a Store-bound package — it skips local test-
# certificate signing (which otherwise overwrites publisher/identity with the
# test cert's own subject, producing a package family name Partner Center
# rejects) and uses the real reserved identity below instead. The Store
# re-signs the package on ingestion, so no local certificate is needed.
msix_config:
  store: true
  # Must exactly match the product name reserved in Partner Center (shown as
  # the page title there: "Sports Rostering | Packages") — NOT the in-app
  # branding name "Sport Rosters" used elsewhere (app title, splash screen).
  display_name: Sports Rostering
  publisher_display_name: Kernkraft Consulting Inc.
  identity_name: KernkraftConsultingInc.SportsRostering
  publisher: CN=BCB6FFA0-B60B-41E1-BFD5-DA72A34681B1
  msix_version: 1.3.2.0
  logo_path: assets/icons/app_icon.png
  start_menu_icon_path: assets/icons/app_icon.png
  tile_icon_path: assets/icons/app_icon.png
  capabilities: internetClient
  languages: en-us
  app_installer:
    publish_folder_path: build\windows\app_installer

flutter_native_splash:
  # Light mode — white background, icon centred
  color: "#ffffff"
  image: assets/icons/app_icon.png
  # Dark mode — dark blue background
  color_dark: "#0d1b2a"
  image_dark: assets/icons/app_icon.png
  android_12:
    color: "#2196F3"
    image: assets/icons/app_icon.png
    color_dark: "#0d1b2a"
    image_dark: assets/icons/app_icon.png
  fullscreen: false
