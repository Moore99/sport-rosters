workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - Keys
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.sportsrostering.app
    cache:
      cache_paths:
        - ~/.pub-cache
        - ios/Pods
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Clean previous builds
        script: rm -rf build
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-name=$(cat version.txt) \
            --build-number=$BUILD_NUMBER \
            --dart-define=GOOGLE_PLACES_API_KEY_IOS=$GOOGLE_PLACES_API_KEY_IOS \
            --dart-define=GOOGLE_PLACES_API_KEY_ANDROID=$GOOGLE_PLACES_API_KEY_ANDROID \
            --export-options-plist=/Users/builder/export_options.plist
      - name: Upload dSYMs to Crashlytics
        script: |
          # Don't assume a fixed location -- flutter build ipa manages its own
          # derived-data path rather than the default ~/Library/Developer/Xcode/DerivedData,
          # and whether Crashlytics resolves via CocoaPods or SPM affects where
          # upload-symbols ends up. Search broadly under $HOME first (covers any
          # DerivedData location), then fall back to the project directory
          # (covers ios/Pods and any project-local SPM checkout dir).
          UPLOAD_SYMBOLS=$(find "$HOME" -type f -name "upload-symbols" -path "*firebase-ios-sdk*" 2>/dev/null | head -1)
          if [ -z "$UPLOAD_SYMBOLS" ]; then
            UPLOAD_SYMBOLS=$(find "$PWD" -type f -name "upload-symbols" 2>/dev/null | head -1)
          fi
          if [ -z "$UPLOAD_SYMBOLS" ]; then
            echo "upload-symbols not found anywhere under \$HOME or the project directory -- searched paths:"
            find "$HOME" -maxdepth 6 -iname "*firebase-ios-sdk*" 2>/dev/null
            exit 1
          fi
          echo "Using upload-symbols at: $UPLOAD_SYMBOLS"
          find build/ios/archive/Runner.xcarchive/dSYMs -name "*.dSYM" | \
          xargs -I {} "$UPLOAD_SYMBOLS" \
            -gsp ios/Runner/GoogleService-Info.plist -p ios {}
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/Runner.xcarchive/dSYMs/*.dSYM
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
