exclude: |
  (?x)^(
    build/|
    .*/build/|
    \.dart_tool/|
    node_modules/|
    .*/node_modules/|
    functions/node_modules/
  )

repos:
  - repo: local
    hooks:
      - id: dart-format
        name: dart format
        entry: dart format
        language: system
        files: \.dart$

  # Stable Prettier pinned to an exact version. mirrors-prettier is archived
  # (last tag v4.0.0-alpha.8) and pinned only the alpha, not its dependencies,
  # so fresh installs drifted from cached ones. Prettier 3 has no dependencies,
  # so this pin covers everything.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: prettier --write --ignore-unknown
        language: node
        # nodeenv picks the newest Node, which may be an alpha that crashes it.
        language_version: 24.11.0
        additional_dependencies: ["prettier@3.9.10"]
        types: [text]
        files: |
          (?x)^(
            functions/.*\.js|
            scripts/.*\.js|
            docs/.*\.html|
            .*\.md|
            web/manifest\.json|
            firestore\.indexes\.json|
            firebase\.json
          )$
        exclude: |
          (?x)^(
            pubspec\.yaml|
            analysis_options\.yaml
          )$
