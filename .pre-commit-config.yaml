exclude: |
  (?x)^(
    build/|
    .*/build/|
    \.dart_tool/|
    node_modules/|
    .*/node_modules/|
    functions/node_modules/
  )

repos:
  - repo: local
    hooks:
      - id: dart-format
        name: dart format
        entry: dart format
        language: system
        files: \.dart$

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: |
          (?x)^(
            functions/.*\.js|
            scripts/.*\.js|
            docs/.*\.html|
            .*\.md|
            web/manifest\.json|
            firestore\.indexes\.json|
            firebase\.json
          )$
        exclude: |
          (?x)^(
            pubspec\.yaml|
            analysis_options\.yaml
          )$
